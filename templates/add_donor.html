<!DOCTYPE html>
<html>

<head>
    <title>Add Donor</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:40px;
        }

        .container{
            width:400px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:darkred;
        }

        label{
            font-weight:bold;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:darkred;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:red;
        }

        a{
            text-decoration:none;
            color:darkred;
        }

    </style>

</head>

<body>

<div class="container">

<h2>➕ Add Donor</h2>

<form action="/add_donor" method="POST">

    <label>Name:</label><br>
    <input type="text" name="name" required>

    <label>Email:</label><br>
    <input type="email" name="email" required>

    <label>Phone:</label><br>
    <input type="text" name="phone" required>

    <label>Location:</label><br>
    <input type="text" name="location" required><br><br>

    <label>Blood Group:</label><br>

    <select name="blood_group" required>

        <option value="">Select Blood Group</option>

        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>

    </select>


    <label>Status:</label><br>

    <select name="status">

        <option value="AVAILABLE">
            AVAILABLE
        </option>

        <option value="NOT AVAILABLE">
            NOT AVAILABLE
        </option>

    </select>

    <button type="submit">
        Add Donor
    </button>

</form>

<br>

<a href="/donors">
    ⬅ Back to Donor List
</a>

</div>

</body>
</html>
