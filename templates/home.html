<!DOCTYPE html>
<html>

<head>
    <title>Blood Donor Management System</title>

    <style>

        body{
            background-image: url("https://dpuhospital.com/images/Services-Images/blood-center.png");

            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            height: 100vh;

            font-family: Arial, sans-serif;
            padding-top: 100px;
            text-align: center;
            color: white;
        }

        a{
            text-decoration: none;
        }

        button{
            width: 250px;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .login{
            background-color: #007bff;
        }

        .register{
            background-color: #a7287d;
        }

        .donor{
            background-color: #178128;
        }

        .view{
            background-color: #ff9800;
        }

        button:hover{
            opacity: 0.9;
        }

    </style>

</head>

<body>

<h2>Blood Donor Management System</h2>

<br>

<a href="/hospital_login">
    <button class="login">🏥 Hospital Login</button>
</a>

<br><br>

<a href="/hospital_register">
    <button class="register">📝 Hospital Register</button>
</a>

<br><br>

<a href="/add_donor">
    <button class="donor">🩸 Register Donor</button>
</a>

<br><br>

<a href="/donors">
    <button class="view">📋 View Donor List</button>
</a>

</body>
</html>
