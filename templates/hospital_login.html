<!DOCTYPE html>
<html>
<head>
    <title>Hospital Login</title>

    <style>

        body{
            background-image: url("https://media.istockphoto.com/id/1141061666/photo/medical-symbol-image-on-high-tech-blue-background.jpg?s=612x612&w=0&k=20&c=_bzzNaTN9ev9rcjm79I9gFMiTE90GHFDOYrOmSKxuN8=");

            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            height: 100vh;

            color: white;
            text-align: center;
            padding-top: 100px;
            font-family: Arial;
        }

        form{
            background-color: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 30px;
            border-radius: 15px;
        }

        input{
            padding: 10px;
            width: 250px;
        }

        button{
            padding: 10px 20px;
        }

        a{
            color: rgb(204, 255, 0);
        }

    </style>

</head>

<body>

<h2>🏥 Hospital Login</h2>

<form method="POST">

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">🔐 Login</button>

</form>

<br><br>

<a href="/">⬅ Back to Home</a><br>
<a href="/hospital_register">📝 Register Hospital</a>

</body>
</html>
